: eth0\n  session:\n    -\n      dnn: oai\n      gateway: 10.45.0.1\n      subnet: 10.45.0.0/16\n  dns:\n    -\n      8.8.8.8\n    -\n      8.8.4.4\n    -\n      2001:4860:4860::8888\n    -\n      2001:4860:4860::8844\n  mtu: 1400\n  #  p-cscf:\n  #    - 127.0.0.1\n  #    - ::1\n  ctf:\n    enabled: auto # auto(default)|yes|no\n################################################################################\n# SMF Info\n################################################################################\n#  \u003cSMF Selection - 5G Core only\u003e\n#  1. SMF sends SmfInfo(S-NSSAI, DNN, TAI) to the NRF\n#  2. NRF responds to AMF with SmfInfo during NF-Discovery.\n#  3. AMF selects SMF based on S-NSSAI, DNN and TAI in SmfInfo.\n#\n#  Note that if there is no SmfInfo, any AMF can select this SMF.\n#\n#  o S-NSSAI[SST:1] and DNN[internet] - At least 1 DNN is required in S-NSSAI\n#  info:\n#    - s_nssai:\n#        - sst: 1\n#          dnn:\n#            - internet\n#\n#  o S-NSSAI[SST:1 SD:009000] and DNN[internet or ims]\n#  info:\n#    - s_nssai:\n#        - sst: 1\n#          sd: 009000\n#          dnn:\n#            - internet\n#            - ims\n#\n#  o S-NSSAI[SST:1] and DNN[internet] and TAI[PLMN-ID:99970 TAC:1]\n#  info:\n#    - s_nssai:\n#        - sst: 1\n#          dnn:\n#            - internet\n#      tai:\n#        - plmn_id:\n#            mcc: 999\n#            mnc: 70\n#          tac: 1\n#\n#  o If any of conditions below are met:\n#   - S-NSSAI[SST:1] and DNN[internet] and TAI[PLMN-ID:99970 TAC:1-9]\n#   - S-NSSAI[SST:2 SD:000080] and DNN[internet or ims]\n#   - S-NSSAI[SST:4] and DNN[internet] and TAI[PLMN-ID:99970 TAC:10-20,30-40]\n#  info:\n#    - s_nssai:\n#        - sst: 1\n#          dnn:\n#            - internet\n#      tai:\n#        - plmn_id:\n#            mcc: 999\n#            mnc: 70\n#          tac:\n#            - 1-9\n#    - s_nssai:\n#        - sst: 2\n#          sd: 000080\n#          dnn:\n#            - internet\n#            - ims\n#    - s_nssai:\n#        - sst: 4\n#          dnn:\n#            - internet\n#      tai:\n#        - plmn_id:\n#            mcc: 999\n#            mnc: 70\n#          tac:\n#            - 10-20\n#            - 30-40\n#\n#  o Complex Example\n#  info:\n#    - s_nssai:\n#        - sst: 1\n#          dnn:\n#            - internet\n#        - sst: 1\n#          sd: 000080\n#          dnn:\n#            - internet\n#            - ims\n#        - sst: 1\n#          sd: 009000\n#          dnn:\n#            [internet, ims]\n#        - sst: 2\n#          dnn:\n#            - internet\n#        - sst: 3\n#          sd: 123456\n#          dnn:\n#            - internet\n#      tai:\n#        - plmn_id:\n#            mcc: 999\n#            mnc: 70\n#          tac: [1, 2, 3]\n#        - plmn_id:\n#            mcc: 999\n#            mnc: 70\n#          tac: 4\n#        - plmn_id:\n#            mcc: 999\n#            mnc: 70\n#          tac:\n#            - 5\n#            - 6\n#        - plmn_id:\n#            mcc: 999\n#            mnc: 70\n#          tac:\n#            - 100-200\n#            - 300-400\n#        - plmn_id:\n#            mcc: 999\n#            mnc: 70\n#          tac:\n#            - 500-600\n#            - 700-800\n#            - 900-1000\n#    - s_nssai:\n#        - sst: 4\n#          dnn:\n#            - internet\n#      tai:\n#        - plmn_id:\n#            mcc: 999\n#            mnc: 70\n#          tac: 99\n#\n################################################################################\n# SBI Server\n################################################################################\n#  o Override SBI address to be advertised to NRF\n#  sbi:\n#    server:\n#      - dev: eth0\n#        advertise: open5gs-smf.svc.local\n#\n#  sbi:\n#    server:\n#      - address: localhost\n#        advertise:\n#          - 127.0.0.99\n#          - ::1\n#\n################################################################################\n# SBI Client\n#########################