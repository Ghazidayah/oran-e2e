apiVersion: v1
data:
  amf.yaml: |2

    logger:
      level: info
    #  level: info   # fatal|error|warn|info(default)|debug|trace

    global:
    # max:
    #   ue: 1024 # The number of UE can be increased depending on memory size.
    #    peer: 64

    amf:
      sbi:
        server:
        - dev: eth0
          port: 7777
        client:
          scp:
          - uri: http://open5gs-scp-sbi:7777
      ngap:
        server:
        - dev: net1
      guami:
        -
          amf_id:
            region: 2
            set: 1
          plmn_id:
            mcc: "999"
            mnc: "70"
      tai:
        -
          plmn_id:
            mcc: "999"
            mnc: "70"
          tac:
          - 1
      plmn_support:
        -
          plmn_id:
            mcc: "999"
            mnc: "70"
          s_nssai:
          - sd: "0x111111"
            sst: 1
          - sst: 1
      security:
        integrity_order: [NIA2, NIA1, NIA0]
        ciphering_order: [NEA0, NEA1, NEA2]
      network_name:
        full: Gradiant
      amf_name: open5gs-amf
      time:
        #    t3502:
        #      value: 720   # 12 minutes * 60 = 720 seconds
        t3512:
          value: 540 # 9 minutes * 60 = 540 seconds

    ################################################################################
    # SBI Server
    ################################################################################
    #  o Override SBI address to be advertised to NRF
    #  sbi:
    #    server:
    #      - dev:eth0
    #        advertise: open5gs-amf.svc.local
    #
    #  sbi:
    #    server:
    #      - address: localhost
    #        advertise:
    #          - 127.0.0.99
    #          - ::1
    #
    ################################################################################
    # SBI Client
    ################################################################################
    #  o Direct communication with NRF interaction
    #  sbi:
    #    client:
    #      nrf:
    #        - uri: http://127.0.0.10:7777
    #
    #  o Indirect communication with delegated discovery
    #  sbi:
    #    client:
    #      scp:
    #        - uri: http://127.0.0.200:7777
    #
    #  o Indirect communication without delegated discovery
    #  sbi:
    #    client:
    #      nrf:
    #        - uri: http://127.0.0.10:7777
    #      scp:
    #        - uri: http://127.0.0.200:7777
    #  discovery:
    #    delegated: no
