apiVersion: apps/v1
kind: Deployment
metadata:
  name: oai-du0
  namespace: oran-ran
  labels:
    app: oai-du0
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: oai-du0
  template:
    metadata:
      labels:
        app: oai-du0
      annotations:
        k8s.v1.cni.cncf.io/networks: '[{"name":"n2-net","ips":["10.10.0.121/24"]}]'
    spec:
      containers:
      - name: oai-du0
        image: oaisoftwarealliance/oai-gnb:2025.w45
        imagePullPolicy: IfNotPresent
        command: ["/opt/oai-gnb/bin/nr-softmodem"]
        args:
        - "-O"
        - "/opt/oai-gnb/etc/gnb.conf"
        - "-E"
        - "--rfsim"
        - "--rfsimulator.serveraddr"
        - "server"
        - "--rfsimulator.serverport"
        - "4043"
        - "--log_config.global_log_options"
        - "level,nocolor,time"
        securityContext:
          capabilities:
            add: ["SYS_NICE"]
        volumeMounts:
        - name: du-config
          mountPath: /opt/oai-gnb/etc/gnb.conf
          subPath: gnb.conf
      volumes:
      - name: du-config
        configMap:
          name: oai-du0-f1-config
---
