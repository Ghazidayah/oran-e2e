#
# n28 700 MHz FDD DU profile for DU0 (full-config swap, NOT a key-patch).
# Derived from manifests/ran/f1/du0.conf (TDD n78 30 kHz) with structural FDD/15 kHz changes.
#
# Radio plan (FDD, 15 kHz SCS, 106 PRB = 20 MHz):
#   DL: 771.71 - 790.79 MHz  (center 781.25)  SSB ARFCN 156250  PointA ARFCN 154342
#   UL: 716.71 - 735.79 MHz  (DL - 55 MHz)                      PointA ARFCN 143342
#   UE args: --numerology 0 --band 28 -C 781250000 --ssb 516 -r 106
#
# DU0 identity (gNB_ID, gNB_DU_ID, nr_cellid, physCellId, F1 addresses, RFsim) is
# preserved 1:1 from du0.conf so the same CU/F1 link and RFsim service keep working.
#
# EMPIRICAL TUNABLES (adjust only if the gNB asserts at boot / RACH fails):
#   - initialDLBWPcontrolResourceSetZero (TS 38.213 Table 13-1, SSB15/PDCCH15)
#   - prach_ConfigurationIndex (FDD/paired-spectrum table 6.3.3.2-2)

Active_gNBs = ( "du-rfsim0");
Asn1_verbosity = "none";

gNBs =
(
 {
    ////////// Identification parameters:
    gNB_ID = 0xe00;
    gNB_DU_ID = 0xe00;
    gNB_name  =  "du-rfsim0";

    tracking_area_code  =  1;
    plmn_list = ({ mcc = 999; mnc = 70; mnc_length = 2; snssaiList = ({ sst = 1; }) });

    nr_cellid = 12345678L;

    ////////// Physical parameters:

    min_rxtxtime = 4;

    servingCellConfigCommon = (
    {
 #spCellConfigCommon

      physCellId                                               = 0;

#  downlinkConfigCommon
    #frequencyInfoDL
      # n28 700 MHz, 15 kHz SCS, 106 PRB (20 MHz). SSB centered (RB43 -> --ssb 516).
      absoluteFrequencySSB                                      = 156250;
      dl_frequencyBand                                          = 28;
      # PointA = SSB - 9.54 MHz (half of a 106 PRB @ 15 kHz carrier) = 154342 ARFCN
      dl_absoluteFrequencyPointA                                = 154342;
      #scs-SpecificCarrierList
        dl_offstToCarrier                                       = 0;
# subcarrierSpacing
# 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
        dl_subcarrierSpacing                                    = 0;
        dl_carrierBandwidth                                     = 106;
     #initialDownlinkBWP
      #genericParameters
        # full 106-PRB BWP (L=106, RBstart=0)
        initialDLBWPlocationAndBandwidth                         = 28875;
# subcarrierSpacing
        initialDLBWPsubcarrierSpacing                             = 0;
      #pdcch-ConfigCommon
        # EMPIRICAL TUNABLE (38.213 Table 13-1, SSB15/PDCCH15)
        initialDLBWPcontrolResourceSetZero                        = 12;
        initialDLBWPsearchSpaceZero                               = 0;

  #uplinkConfigCommon
     #frequencyInfoUL
      ul_frequencyBand                                             = 28;
      # FDD: UL PointA = DL PointA - 55 MHz (n28 DL/UL separation) = 143342 ARFCN
      ul_absoluteFrequencyPointA                                  = 143342;
      #scs-SpecificCarrierList
      ul_offstToCarrier                                            = 0;
# subcarrierSpacing
      ul_subcarrierSpacing                                         = 0;
      ul_carrierBandwidth                                          = 106;
      pMax                                                         = 20;
     #initialUplinkBWP
      #genericParameters
        initialULBWPlocationAndBandwidth                           = 28875;
# subcarrierSpacing
        initialULBWPsubcarrierSpacing                              = 0;
      #rach-ConfigCommon
        #rach-ConfigGeneric
          # EMPIRICAL TUNABLE for FDD/paired spectrum (38.211 6.3.3.2-2)
          prach_ConfigurationIndex                                 = 16;
#prach_msg1_FDM
#0 = one, 1=two, 2=four, 3=eight
          prach_msg1_FDM                                           = 0;
          prach_msg1_FrequencyStart                                = 0;
          zeroCorrelationZoneConfig                                = 1;
          preambleReceivedTargetPower                              = -96;
#preamblTransMax (0...10) = (3,4,5,6,7,8,10,20,50,100,200)
          preambleTransMax                                         = 6;
#powerRampingStep
# 0=dB0,1=dB2,2=dB4,3=dB6
        powerRampingStep                                           = 1;
#ssb_perRACH_OccasionAndCB_PreamblesPerSSB_PR
#1=oneeighth,2=onefourth,3=half,4=one,5=two,6=four,7=eight,8=sixteen
        ssb_perRACH_OccasionAndCB_PreamblesPerSSB_PR               = 4;
#one (0..15) 4,8,12,16,...60,64
        ssb_perRACH_OccasionAndCB_PreamblesPerSSB                  = 14;
#ra_ContentionResolutionTimer
#(0..7) 8,16,24,32,40,48,56,64
        ra_ContentionResolutionTimer                               = 7;
        rsrp_ThresholdSSB                                          = 19;
#prach-RootSequenceIndex_PR
#1 = 839, 2 = 139
        prach_RootSequenceIndex_PR                                 = 1;
        prach_RootSequenceIndex                                    = 1;
        # msg1 SCS = 15 kHz for a 15 kHz cell
        msg1_SubcarrierSpacing                                     = 0,
# restrictedSetConfig
# 0=unrestricted, 1=restricted type A, 2=restricted type B
        restrictedSetConfig                                        = 0,

        msg3_DeltaPreamble                                         = 1;
        p0_NominalWithGrant                                        =-90;

# pucch-ConfigCommon setup :
# pucchGroupHopping
# 0 = neither, 1= group hopping, 2=sequence hopping
        pucchGroupHopping                                          = 0;
        hoppingId                                                  = 40;
        p0_nominal                                                 = -90;

      ssb_PositionsInBurst_Bitmap                                  = 1;

# ssb_periodicityServingCell
# 0 = ms5, 1=ms10, 2=ms20, 3=ms40, 4=ms80, 5=ms160, 6=spare2, 7=spare1
      ssb_periodicityServingCell                                   = 2;

# dmrs_TypeA_position
# 0 = pos2, 1 = pos3
      dmrs_TypeA_Position                                           = 0;

# subcarrierSpacing
# 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
      subcarrierSpacing                                            = 0;

      # FDD band: NO tdd-UL-DL-ConfigurationCommon block (removed on purpose).

      ssPBCH_BlockPower                                            = -25;
     }

  );

    # ------- SCTP definitions
    SCTP :
    {
        SCTP_INSTREAMS  = 2;
        SCTP_OUTSTREAMS = 2;
    };
  }
);

MACRLCs = ({
    tr_s_preference     = "local_L1";
    tr_n_preference     = "f1";
    local_n_address     = "10.10.0.121";
    remote_n_address    = "10.10.0.120";
    local_n_portd       = 2152;
    remote_n_portd      = 2152;
    pusch_FailureThres  = 1000;
});

L1s = ({
    tr_n_preference = "local_mac";
    prach_dtx_threshold = 200;
    pucch0_dtx_threshold = 150;
    ofdm_offset_divisor = 8;
});

RUs = ({
    local_rf       = "yes"
    nb_tx          = 1
    nb_rx          = 1
    att_tx         = 0
    att_rx         = 0;
    bands          = [28];
    max_pdschReferenceSignalPower = -27;
    max_rxgain                    = 114;
    eNB_instances  = [0];
    clock_src = "internal";
});

rfsimulator =({
  serveraddr = "server";
  serverport = 4043;
  options = ();
  modelname = "AWGN";
  IQfile = "/tmp/rfsimulator.iqs"
});

log_config: {
  global_log_level = "info";
  hw_log_level     = "info";
  nr_phy_log_level = "info";
  nr_mac_log_level = "info";
  rlc_log_level    = "info";
  pdcp_log_level   = "info";
  rrc_log_level    = "info";
  f1ap_log_level   = "info";
  ngap_log_level   = "debug";
};

e2_agent = {
  near_ric_ip_addr = "127.0.0.1";
  sm_dir = "/usr/local/lib/flexric/"
};
