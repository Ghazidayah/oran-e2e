# CU-UP (user plane): PDCP/SDAP + NG-U->UPF + F1-U + E1 client
# Derived from OAI gnb-cuup.sa.f1.conf reference, adapted to this platform.
Active_gNBs = ( "cu-rfsim");
Asn1_verbosity = "none";

gNBs =
(
 {
    gNB_ID = 0xe00;
    gNB_CU_UP_ID = 0xe00;
    gNB_name  =  "cu-rfsim";
    tracking_area_code  =  1;
    plmn_list = ({ mcc = 999; mnc = 70; mnc_length = 2; snssaiList = ({ sst = 1; }, { sst = 2; }, { sst = 3; }) });

    tr_s_preference = "f1";
    local_s_address  = "10.10.0.140";   # F1-U (TNL signaled to DUs via F1AP)
    remote_s_address = "0.0.0.0";       # multiple DUs
    local_s_portd    = 2152;
    remote_s_portd   = 2152;

    SCTP : { SCTP_INSTREAMS = 2; SCTP_OUTSTREAMS = 2; };

    E1_INTERFACE =
    (
      {
        type = "up";
        ipv4_cucp = "10.10.0.120";
        ipv4_cuup = "10.10.0.140";
      }
    )

    NETWORK_INTERFACES :
    {
        GNB_IPV4_ADDRESS_FOR_NG_AMF              = "10.10.0.140";
        GNB_IPV4_ADDRESS_FOR_NGU                 = "10.20.0.120";  # N3 to UPF (inherited)
        GNB_PORT_FOR_S1U                         = 2152;
    };
  }
);

log_config : {
  global_log_level = "info";
  pdcp_log_level   = "info";
  f1ap_log_level   = "info";
  ngap_log_level   = "info";
  e1ap_log_level   = "debug";
};
