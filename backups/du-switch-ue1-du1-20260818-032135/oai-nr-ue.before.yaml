        volumeMounts:
        - mountPath: /opt/oai-nr-ue/etc/nr-ue.conf
          name: nrue-config
          subPath: nr-ue.conf
        - mountPath: /dev/net/tun
          name: tun-device
      dnsPolicy: ClusterFirst
