n      ul_frequencyBand                                                 = 78;\n      #scs-SpecificCarrierList\n      ul_offstToCarrier                                              = 0;\n# subcarrierSpacing\n# 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120\n      ul_subcarrierSpacing                                           = 1;\n      ul_carrierBandwidth                                            = 106;\n      pMax                                                          = 20;\n     #initialUplinkBWP\n      #genericParameters\n        initialULBWPlocationAndBandwidth                                        = 28875;\n# subcarrierSpacing\n# 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120\n        initialULBWPsubcarrierSpacing                                           = 1;\n      #rach-ConfigCommon\n        #rach-ConfigGeneric\n          prach_ConfigurationIndex                                  = 98;\n#prach_msg1_FDM\n#0 = one, 1=two, 2=four, 3=eight\n          prach_msg1_FDM                                            = 0;\n          prach_msg1_FrequencyStart                                 = 0;\n          zeroCorrelationZoneConfig                                 = 12;\n          preambleReceivedTargetPower                               = -104;\n#preamblTransMax (0...10) = (3,4,5,6,7,8,10,20,50,100,200)\n          preambleTransMax                                          = 6;\n#powerRampingStep\n# 0=dB0,1=dB2,2=dB4,3=dB6\n        powerRampingStep                                            = 1;\n#ssb_perRACH_OccasionAndCB_PreamblesPerSSB_PR\n#1=oneeighth,2=onefourth,3=half,4=one,5=two,6=four,7=eight,8=sixteen\n        ssb_perRACH_OccasionAndCB_PreamblesPerSSB_PR                = 4;\n#one (0..15) 4,8,12,16,...60,64\n        ssb_perRACH_OccasionAndCB_PreamblesPerSSB                   = 15;\n#ra_ContentionResolutionTimer\n#(0..7) 8,16,24,32,40,48,56,64\n        ra_ContentionResolutionTimer                                = 7;\n        rsrp_ThresholdSSB                                           = 19;\n#prach-RootSequenceIndex_PR\n#1 = 839, 2 = 139\n        prach_RootSequenceIndex_PR                                  = 2;\n        prach_RootSequenceIndex                                     = 1;\n        # SCS for msg1, can only be 15 for 30 kHz \u003c 6 GHz, takes precendence over the one derived from prach-ConfigIndex\n        #\n        msg1_SubcarrierSpacing                                      = 1,\n# restrictedSetConfig\n# 0=unrestricted, 1=restricted type A, 2=restricted type B\n        restrictedSetConfig                                         = 0,\n\n        msg3_DeltaPreamble                                          = 1;\n        p0_NominalWithGrant                                         =-90;\n\n# pucch-ConfigCommon setup :\n# pucchGroupHopping\n# 0 = neither, 1= group hopping, 2=sequence hopping\n        pucchGroupHopping                                           = 0;\n        hoppingId                                                   = 40;\n        p0_nominal                                                  = -90;\n\n      ssb_PositionsInBurst_Bitmap                                   = 1;\n\n# ssb_periodicityServingCell\n# 0 = ms5, 1=ms10, 2=ms20, 3=ms40, 4=ms80, 5=ms160, 6=spare2, 7=spare1\n      ssb_periodicityServingCell                                    = 2;\n\n# dmrs_TypeA_position\n# 0 = pos2, 1 = pos3\n      dmrs_TypeA_Position                                           = 0;\n\n# subcarrierSpacing\n# 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120\n      subcarrierSpacing                                             = 1;\n\n\n  #tdd-UL-DL-ConfigurationCommon\n# subcarrierSpacing\n# 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120\n      referenceSubcarrierSpacing                                    = 1;\n      # pattern1\n      # dl_UL_TransmissionPeriodicity\n      # 0=ms0p5, 1=ms0p625, 2=ms1, 3=ms1p25, 4=ms2, 5=ms2p5, 6=ms5, 7=ms10\n      dl_UL_TransmissionPeriodicity                                 = 6;\n      nrofDownlinkSlots                                             = 7;\n      nrofDownlinkSymbols                                           = 6;\n      nrofUplinkSlots                                               = 2;\n      nrofUplinkSymbols                                             = 4;\n\n  ssPBCH_BlockPower                                             = -25;\n  }\n\n  );\n\n\n    # ------- SCTP definitions\n    SCTP :\n    {\n        # Number of streams to use in input/output\n        SCTP_INSTREAMS  = 2;\n        SCTP_OUTSTREAMS = 2;\n    };\n\n    ////////// AMF parameters:\n        amf_ip_address = ({ ipv4 = \"10.10.0.101\"; });\n\n        NETWORK_INTERFACES :\n        {\n\n           GNB_IPV4_ADDRESS_FOR_NG_AMF = \"10.10.0.110\";\n           GNB_IPV4_ADDRESS_FOR_NGU = \"10.20.0.110\";\n           GNB_PORT_FOR_S1U                         = 2152; # Spec 2152\n        };\n\n  }\n);\n\nMACRLCs = (\n  {\n    num_cc           = 1;\n    tr_s_preference  = \"local_L1\";\n    tr_n_preference  = \"local_RRC\";\n    pusch_TargetSNRx10 = 200;\n    pucch_TargetSNRx10 = 200;\n  }\n);\n\nL1s = (\n{\n  num_cc = 1;\n  tr_n_preference = \"local_mac\";\n  prach_dtx_threshold = 200;\n#  pucch0_dtx_threshold = 150;\n}\n);\n\nRUs = (\n    {\n       local_rf       = \"yes\"\n         nb_tx          = 1\n         nb_rx          = 1\n         att_tx         = 0\n         att_rx         = 0;\n         bands          = [78];\n         max_pdschReferenceSignalPower = -27;\n         max_rxgain                    = 75;\n         eNB_instances  = [0];\n         sf_extension = 0\n         sdr_addrs = \"serial=XXXXXXX\"\n    }\n);\n\n\nrfsimulator = (\n  {\n    serveraddr = \"server\";\n  }\n);\n\nsecurity = {\n  # preferred ciphering algorithms\n  # the first one of the list that an UE supports in chosen\n  # valid values: nea0, nea1, nea2, nea3\n  ciphering_algorithms = ( \"nea0\" );\n\n  # preferred integrity algorithms\n  # the first one of the list that an UE supports in chosen\n  # valid values: nia0, nia1, nia2, nia3\n  integrity_algorithms = ( \"nia2\", \"nia0\" );\n\n  # setting 'drb_ciphering' to \"no\" disables ciphering for DRBs, no matter\n  # what 'ciphering_algorithms' configures; same thing for 'drb_integrity'\n  drb_ciphering = \"yes\";\n  drb_integrity = \"no\";\n};\n\n     log_config :\n     {\n       global_log_level                      =\"info\";\n       hw_log_level                          =\"info\";\n       phy_log_level                         =\"info\";\n       mac_log_level                         =\"info\";\n       rlc_log_level                         =\"info\";\n       pdcp_log_level                        =\"info\";\n       rrc_log_level                         =\"info\";\n       f1ap_log_level                         =\"debug\";\n    };\n"},"kind":"ConfigMap","metadata":{"annotations":{},"name":"oai-gnb-config","namespace":"oran-ran"}}
    creationTimestamp: "2026-03-16T13:42:56Z"
    name: oai-gnb-config
    namespace: oran-ran
    resourceVersion: "425965"
    uid: 2b8e00e0-1a08-43f8-ad8f-5ad25277b702
- apiVersion: v1
  data:
    gnb.conf: |
      Active_gNBs = ( "gnb-rfsim");
      # Asn1_verbosity, choice in: none, info, annoying
      Asn1_verbosity = "none";

      gNBs =
      (
       {
          ////////// Identification parameters:
          gNB_ID = 0xe00;

      #     cell_type =  "CELL_MACRO_GNB";

          gNB_name  =  "gnb-rfsim";

          // Tracking area code, 0x0000 and 0xfffe are reserved values
          tracking_area_code  =  1;

          plmn_list = ({ mcc = 999; mnc = 70; mnc_length = 2; snssaiList = ({ sst = 1; }) });

          nr_cellid = 12345678L

      #     tr_s_preference     = "local_mac"

          ////////// Physical parameters:

          min_rxtxtime = 6;

          servingCellConfigCommon = (
          {
       #spCellConfigCommon

            physCellId                                                    = 0;

      #  downlinkConfigCommon
          #frequencyInfoDL
            # this is 3300.60 MHz + 53*12*30e-3 MHz = 3319.68
            absoluteFrequencySSB                                          = 621312;
            # this is 3300.60 MHz
            dl_absoluteFrequencyPointA                                       = 620040;
            #scs-SpecificCarrierList
              dl_offstToCarrier                                              = 0;
      # subcarrierSpacing
      # 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
              dl_subcarrierSpacing                                           = 1;
              dl_carrierBandwidth                                            = 106;
           #initialDownlinkBWP
            #genericParameters
              # this is RBstart=0,L=106 (275*(L-1))+RBstart
              initialDLBWPlocationAndBandwidth                                        = 28875;
      # subcarrierSpacing
      # 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
              initialDLBWPsubcarrierSpacing                                           = 1;
            #pdcch-ConfigCommon
              initialDLBWPcontrolResourceSetZero                                      = 11;
              initialDLBWPsearchSpaceZero                                             = 0;



        #uplinkConfigCommon
           #frequencyInfoUL
            ul_frequencyBand                                                 = 78;
            #scs-SpecificCarrierList
            ul_offstToCarrier                                              = 0;
      # subcarrierSpacing
      # 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
            ul_subcarrierSpacing                                           = 1;
            ul_carrierBandwidth                                            = 106;
            pMax                                                          = 20;
           #initialUplinkBWP
            #genericParameters
              initialULBWPlocationAndBandwidth                                        = 28875;
      # subcarrierSpacing
      # 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
              initialULBWPsubcarrierSpacing                                           = 1;
            #rach-ConfigCommon
              #rach-ConfigGeneric
                prach_ConfigurationIndex                                  = 98;
      #prach_msg1_FDM
      #0 = one, 1=two, 2=four, 3=eight
                prach_msg1_FDM                                            = 0;
                prach_msg1_FrequencyStart                                 = 0;
                zeroCorrelationZoneConfig                                 = 12;
                preambleReceivedTargetPower                               = -104;
      #preamblTransMax (0...10) = (3,4,5,6,7,8,10,20,50,100,200)
                preambleTransMax                                          = 6;
      #powerRampingStep
      # 0=dB0,1=dB2,2=dB4,3=dB6
              powerRampingStep                                            = 1;
      #ssb_perRACH_OccasionAndCB_PreamblesPerSSB_PR
      #1=oneeighth,2=onefourth,3=half,4=one,5=two,6=four,7=eight,8=sixteen
              ssb_perRACH_OccasionAndCB_PreamblesPerSSB_PR                = 4;
      #one (0..15) 4,8,12,16,...60,64
              ssb_perRACH_OccasionAndCB_PreamblesPerSSB                   = 15;
      #ra_ContentionResolutionTimer
      #(0..7) 8,16,24,32,40,48,56,64
              ra_ContentionResolutionTimer                                = 7;
              rsrp_ThresholdSSB                                           = 19;
      #prach-RootSequenceIndex_PR
      #1 = 839, 2 = 139
              prach_RootSequenceIndex_PR                                  = 2;
              prach_RootSequenceIndex                                     = 1;
              # SCS for msg1, can only be 15 for 30 kHz < 6 GHz, takes precendence over the one derived from prach-ConfigIndex
              #
              msg1_SubcarrierSpacing                                      = 1,
      # restrictedSetConfig
      # 0=unrestricted, 1=restricted type A, 2=restricted type B
              restrictedSetConfig                                         = 0,

              msg3_DeltaPreamble                                          = 1;
              p0_NominalWithGrant                                         =-90;

      # pucch-ConfigCommon setup :
      # pucchGroupHopping
      # 0 = neither, 1= group hopping, 2=sequence hopping
              pucchGroupHopping                                           = 0;
              hoppingId                                                   = 40;
              p0_nominal                                                  = -90;

            ssb_PositionsInBurst_Bitmap                                   = 1;

      # ssb_periodicityServingCell
      # 0 = ms5, 1=ms10, 2=ms20, 3=ms40, 4=ms80, 5=ms160, 6=spare2, 7=spare1
            ssb_periodicityServingCell                                    = 2;

      # dmrs_TypeA_position
      # 0 = pos2, 1 = pos3
            dmrs_TypeA_Position                                           = 0;

      # subcarrierSpacing
      # 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
            subcarrierSpacing                                             = 1;


        #tdd-UL-DL-ConfigurationCommon
      # subcarrierSpacing
      # 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
            referenceSubcarrierSpacing                                    = 1;
            # pattern1
            # dl_UL_TransmissionPeriodicity
            # 0=ms0p5, 1=ms0p625, 2=ms1, 3=ms1p25, 4=ms2, 5=ms2p5, 6=ms5, 7=ms10
            dl_UL_TransmissionPeriodicity                                 = 6;
            nrofDownlinkSlots                                             = 7;
            nrofDownlinkSymbols                                           = 6;
            nrofUplinkSlots                                               = 2;
            nrofUplinkSymbols                                             = 4;

        ssPBCH_BlockPower                                             = -25;
        }

        );


          # ------- SCTP definitions
          SCTP :
          {
              # Number of streams to use in input/output
              SCTP_INSTREAMS  = 2;
              SCTP_OUTSTREAMS = 2;
          };

          ////////// AMF parameters:
              amf_ip_address = ({ ipv4 = "10.10.0.101"; });

              NETWORK_INTERFACES :
              {

                 GNB_IPV4_ADDRESS_FOR_NG_AMF = "10.10.0.110";
                 GNB_IPV4_ADDRESS_FOR_NGU = "10.20.0.110";
                 GNB_PORT_FOR_S1U                         = 2152; # Spec 2152
              };

        }
      );

      MACRLCs = (
        {
          num_cc           = 1;
          tr_s_preference  = "local_L1";
          tr_n_preference  = "local_RRC";
          pusch_TargetSNRx10 = 200;
          pucch_TargetSNRx10 = 200;
        }
      );

      L1s = (
      {
        num_cc = 1;
        tr_n_preference = "local_mac";
        prach_dtx_threshold = 200;
      #  pucch0_dtx_threshold = 150;
      }
      );

      RUs = (
          {
             local_rf       = "yes"
               nb_tx          = 1
               nb_rx          = 1
               att_tx         = 0
               att_rx         = 0;
               bands          = [78];
               max_pdschReferenceSignalPower = -27;
               max_rxgain                    = 75;
               eNB_instances  = [0];
               sf_extension = 0
               sdr_addrs = "serial=XXXXXXX"
          }
      );


      rfsimulator = (
        {
          serveraddr = "server";
        }
      );

      security = {
        # preferred ciphering algorithms
        # the first one of the list that an UE supports in chosen
        # valid values: nea0, nea1, nea2, nea3
        ciphering_algorithms = ( "nea0" );

        # preferred integrity algorithms
        # the first one of the list that an UE supports in chosen
        # valid values: nia0, nia1, nia2, nia3
        integrity_algorithms = ( "nia2", "nia0" );

        # setting 'drb_ciphering' to "no" disables ciphering for DRBs, no matter
        # what 'ciphering_algorithms' configures; same thing for 'drb_integrity'
        drb_ciphering = "yes";
        drb_integrity = "no";
      };

           log_config :
           {
             global_log_level                      ="info";
             hw_log_level                          ="info";
             phy_log_level                         ="info";
             mac_log_level                         ="info";
             rlc_log_level                         ="info";
             pdcp_log_level                        ="info";
             rrc_log_level                         ="info";
             f1ap_log_level                         ="debug";
          };
